version: 2
updates:
  # 📦 Combustibles NPM dependencies
  - package-ecosystem: "npm"
    directory: "/combustibles"
    schedule:
      interval: "monthly"
      day: "monday"  
      time: "10:00"
    open-pull-requests-limit: 2
    reviewers:
      - "evertweb"
    assignees:
      - "evertweb"
    target-branch: "main"
    commit-message:
      prefix: "⬆️ deps:"
      include: "scope"
    groups:
      react:
        patterns:
          - "react*"
          - "@types/react*"
      vite:
        patterns:
          - "vite*"
          - "@vitejs/*"
      firebase:
        patterns:
          - "firebase*"
          - "@firebase/*"

  # 🍽️ Alimentacion NPM dependencies  
  - package-ecosystem: "npm"
    directory: "/alimentacion"
    schedule:
      interval: "monthly"
      day: "monday"
      time: "10:00"
    open-pull-requests-limit: 2
    reviewers:
      - "evertweb"
    assignees:
      - "evertweb"
    target-branch: "main"
    commit-message:
      prefix: "⬆️ deps:"
      include: "scope"
    # Ignorar actualizaciones major que rompen compatibilidad
    ignore:
      - dependency-name: "firebase"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react"
        update-types: ["version-update:semver-major"]
    groups:
      react:
        patterns:
          - "react*"
          - "@types/react*"
      testing:
        patterns:
          - "jest*"
          - "@testing-library/*"
      firebase:
        patterns:
          - "firebase*"
          - "@firebase/*"

  # 🔧 Root workspace dependencies
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
      day: "monday"
      time: "11:00"
    open-pull-requests-limit: 2
    reviewers:
      - "evertweb"
    assignees:
      - "evertweb"
    commit-message:
      prefix: "⬆️ workspace:"
      include: "scope"
    # Ignorar actualizaciones major
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # 🚀 GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
      day: "monday"
      time: "10:00"
    open-pull-requests-limit: 2
    reviewers:
      - "evertweb"
    assignees:
      - "evertweb"
    commit-message:
      prefix: "⬆️ actions:"
      include: "scope"