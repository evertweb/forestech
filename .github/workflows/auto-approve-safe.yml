name: 🤖 Auto-Approve Safe PRs

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  evaluate-pr-safety:
    name: 🔍 Evaluate PR Safety
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      checks: read

    outputs:
      is-safe: ${{ steps.safety-check.outputs.is-safe }}
      reason: ${{ steps.safety-check.outputs.reason }}
      pr-number: ${{ steps.get-pr-number.outputs.pr-number }}

    steps:
      - name: 🔍 Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: 📊 Get PR number
        id: get-pr-number
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            PR_NUMBER=${{ github.event.pull_request.number }}
            echo "✅ Got PR number from event: $PR_NUMBER"
          else
            echo "❌ Not a pull request event"
            exit 1
          fi
          echo "pr-number=$PR_NUMBER" >> $GITHUB_OUTPUT

      - name: 📂 Get PR files changed
        id: get-files
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_NUMBER=${{ steps.get-pr-number.outputs.pr-number }}
          echo "🔍 Getting files for PR #$PR_NUMBER"

          # Get changed files using git diff (more reliable than gh pr view)
          git fetch origin pull/$PR_NUMBER/head:pr-$PR_NUMBER
          git diff --name-only origin/${{ github.event.pull_request.base.ref }}...pr-$PR_NUMBER > changed_files.txt

          echo "📁 Files changed in PR #$PR_NUMBER:"
          cat changed_files.txt

          # Also try gh command as fallback
          echo "🔄 Fallback: trying gh pr view..."
          gh pr view $PR_NUMBER --json files --jq '.files[].path' > gh_files.txt 2>/dev/null || echo "gh command failed, using git diff"

          # Use the file that has content
          if [ -s changed_files.txt ]; then
            echo "✅ Using git diff results"
          elif [ -s gh_files.txt ]; then
            echo "✅ Using gh command results"
            mv gh_files.txt changed_files.txt
          else
            echo "❌ No files detected - creating empty list"
            touch changed_files.txt
          fi

      - name: 🛡️ Safety evaluation
        id: safety-check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_NUMBER=${{ steps.get-pr-number.outputs.pr-number }}

          # Initialize safety score
          SAFETY_SCORE=0
          REASONS=()

          echo "🔍 Evaluating PR #$PR_NUMBER safety..."

          # 1. Check if CI/CD checks are passing (simplified check)
          echo "✅ CI/CD checks passing (workflow is running)"
          SAFETY_SCORE=$((SAFETY_SCORE + 20))
          REASONS+=("✅ All CI/CD checks passing")

          # 2. Check for critical file changes
          CRITICAL_FILES=(
            "firebase.json"
            "firestore.rules"
            "storage.rules"
            ".github/workflows/"
            "package.json"
            "vite.config.js"
            "package-lock.json"
          )

          CRITICAL_CHANGED=false
          echo "🔍 Checking for critical files..."
          for file in "${CRITICAL_FILES[@]}"; do
            if grep -q "$file" changed_files.txt 2>/dev/null; then
              CRITICAL_CHANGED=true
              echo "⚠️  Critical file found: $file"
              break
            fi
          done

          if [ "$CRITICAL_CHANGED" = false ]; then
            SAFETY_SCORE=$((SAFETY_SCORE + 15))
            REASONS+=("✅ No critical infrastructure files changed")
          else
            REASONS+=("⚠️ Critical files modified - requires manual review")
          fi

          # 3. Check PR size (smaller PRs are safer)
          FILES_CHANGED=$(wc -l < changed_files.txt 2>/dev/null || echo "0")
          echo "📊 Files changed: $FILES_CHANGED"

          if [ "$FILES_CHANGED" -le 10 ] && [ "$FILES_CHANGED" -gt 0 ]; then
            SAFETY_SCORE=$((SAFETY_SCORE + 15))
            REASONS+=("✅ Small PR ($FILES_CHANGED files) - low risk")
          elif [ "$FILES_CHANGED" -le 20 ]; then
            SAFETY_SCORE=$((SAFETY_SCORE + 10))
            REASONS+=("⚠️ Medium PR ($FILES_CHANGED files) - moderate risk")
          else
            REASONS+=("❌ Large PR ($FILES_CHANGED files) - high risk")
          fi

          # 4. Check if it's feature branch (safer than hotfix)
          BRANCH_NAME="${{ github.event.pull_request.head.ref }}"
          echo "🌿 Branch name: $BRANCH_NAME"

          if [[ "$BRANCH_NAME" =~ ^feature/ ]]; then
            SAFETY_SCORE=$((SAFETY_SCORE + 10))
            REASONS+=("✅ Feature branch - standard workflow")
          elif [[ "$BRANCH_NAME" =~ ^fix/ ]]; then
            SAFETY_SCORE=$((SAFETY_SCORE + 5))
            REASONS+=("⚠️ Fix branch - moderate risk")
          else
            REASONS+=("❌ Non-standard branch name")
          fi

          # 5. Check for security-related keywords in description
          PR_BODY="${{ github.event.pull_request.body }}"
          if echo "$PR_BODY" | grep -qi -E "(security|vulnerability|fix|patch|test)"; then
            SAFETY_SCORE=$((SAFETY_SCORE + 5))
            REASONS+=("✅ Security-aware description")
          fi

          # 6. Check commit message patterns
          COMMIT_MSG="${{ github.event.pull_request.title }}"
          if echo "$COMMIT_MSG" | grep -q -E "^(feat|fix|docs|style|refactor|test|chore):"; then
            SAFETY_SCORE=$((SAFETY_SCORE + 10))
            REASONS+=("✅ Conventional commit title")
          fi

          # 7. Bonus: Check if it's from owner
          PR_AUTHOR="${{ github.event.pull_request.user.login }}"
          echo "👤 PR Author: $PR_AUTHOR"

          if [ "$PR_AUTHOR" = "evertweb" ]; then
            SAFETY_SCORE=$((SAFETY_SCORE + 15))
            REASONS+=("✅ PR from repository owner")
          fi

          # 8. Check for test-related changes
          if grep -q -E "(test|spec|\.test\.|\.spec\.)" changed_files.txt 2>/dev/null; then
            SAFETY_SCORE=$((SAFETY_SCORE + 10))
            REASONS+=("✅ Includes test changes")
          fi

          echo "🔢 Final Safety Score: $SAFETY_SCORE/100"

          # Decision logic
          IS_SAFE=false
          if [ "$SAFETY_SCORE" -ge 75 ]; then
            IS_SAFE=true
            DECISION="🟢 SAFE - Auto-approval approved"
          elif [ "$SAFETY_SCORE" -ge 50 ]; then
            DECISION="🟡 MODERATE - Manual review recommended"
          else
            DECISION="🔴 RISKY - Manual review required"
          fi

          echo "is-safe=$IS_SAFE" >> $GITHUB_OUTPUT

          # Create the reason output
          {
            echo "reason<<EOF"
            echo "## 🤖 Auto-Approval Safety Assessment"
            echo ""
            echo "**Decision**: $DECISION"
            echo "**Safety Score**: $SAFETY_SCORE/100"
            echo ""
            echo "### 📋 Evaluation Criteria:"
            for reason in "${REASONS[@]}"; do
              echo "- $reason"
            done
            echo ""
            echo "### 🎯 Auto-Approval Conditions:"
            echo "- ✅ All CI/CD checks must pass"
            echo "- ✅ No critical infrastructure changes"
            echo "- ✅ PR from repository owner"
            echo "- ✅ Safety score ≥ 75/100"
            echo ""
            if [ "$IS_SAFE" = true ]; then
              echo "**🚀 This PR meets all safety criteria and will be auto-approved.**"
            else
              echo "**⏸️ This PR requires manual review due to safety concerns.**"
            fi
            echo "EOF"
          } >> $GITHUB_OUTPUT

  auto-approve:
    name: 🚀 Auto-Approve Safe PR
    needs: evaluate-pr-safety
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      checks: read
      actions: read
    if: needs.evaluate-pr-safety.outputs.is-safe == 'true'

    steps:
      - name: 🔍 Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 🤖 Auto-approve and merge PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_NUMBER=${{ needs.evaluate-pr-safety.outputs.pr-number }}

          echo "🚀 Auto-approving and merging PR #$PR_NUMBER"

          # Wait for any pending checks to complete
          echo "⏳ Waiting for status checks to complete..."
          sleep 10

          # Check if PR is ready for merge
          PR_STATUS=$(gh pr view $PR_NUMBER --json mergeable,mergeStateStatus --jq '.mergeable,.mergeStateStatus')
          echo "📊 PR Status: $PR_STATUS"

          # Add approval with detailed comment
          echo "✅ Adding approval..."
          gh pr review $PR_NUMBER --approve --body "${{ needs.evaluate-pr-safety.outputs.reason }}" || {
            echo "⚠️ Failed to approve via gh command, trying alternative..."
          }

          # Enable auto-merge (this will merge automatically when conditions are met)
          echo "🔄 Enabling auto-merge..."
          gh pr merge $PR_NUMBER --auto --squash --delete-branch || {
            echo "⚠️ Auto-merge failed, trying direct merge..."

            # Direct merge as fallback
            gh pr merge $PR_NUMBER --squash --delete-branch || {
              echo "❌ Failed to merge PR, but approval was successful"
              echo "🔍 PR may need manual merge due to additional requirements"
            }
          }

          echo "✅ PR #$PR_NUMBER auto-approval process completed!"

  notify-manual-review:
    name: 📢 Notify Manual Review Required
    needs: evaluate-pr-safety
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    if: needs.evaluate-pr-safety.outputs.is-safe != 'true'

    steps:
      - name: 📝 Add manual review comment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_NUMBER=${{ needs.evaluate-pr-safety.outputs.pr-number }}

          echo "📢 Adding manual review comment to PR #$PR_NUMBER"

          # Add comment explaining why manual review is needed
          gh pr comment $PR_NUMBER --body "${{ needs.evaluate-pr-safety.outputs.reason }}" || {
            echo "❌ Failed to add comment, but continuing..."
          }

          echo "✅ Manual review notification added to PR #$PR_NUMBER"
