name: Copilot Agent Bridge - Detección de Errores y Delegación

on:
  # 🔄 NUEVO ORDEN: Solo se ejecuta cuando el deploy falla
  workflow_run:
    workflows: ["Deploy Forestech to Firebase (Optimized)"]
    types:
      - completed
    branches: [main]
  
  # 🔧 Mantener opción manual para debugging
  workflow_dispatch:
    inputs:
      force_error_collection:
        description: 'Forzar recolección de errores incluso si los builds pasan'
        required: false
        default: 'false'

permissions:
  contents: read
  issues: write
  pull-requests: write
  actions: read

jobs:
  # 🛡️ Solo ejecutar si el deploy anterior falló
  check-deploy-failure:
    name: Verificar Fallo del Deploy
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'failure' || github.event_name == 'workflow_dispatch'
    outputs:
      should-run: ${{ steps.check.outputs.should-run }}
    steps:
      - name: 🔍 Verificar necesidad de intervención
        id: check
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "🔧 Ejecución manual forzada"
            echo "should-run=true" >> $GITHUB_OUTPUT
          elif [[ "${{ github.event.workflow_run.conclusion }}" == "failure" ]]; then
            echo "❌ Deploy falló - activando Copilot Agent Bridge"
            echo "should-run=true" >> $GITHUB_OUTPUT
          else
            echo "✅ Deploy exitoso - no se requiere intervención"
            echo "should-run=false" >> $GITHUB_OUTPUT
          fi

  build-and-bridge:
    name: Detección de Build y Puente a Copilot
    runs-on: ubuntu-latest
    needs: check-deploy-failure
    if: needs.check-deploy-failure.outputs.should-run == 'true'

    steps:
    - name: Checkout del Repositorio
      uses: actions/checkout@v4

    - name: Configurar Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'

    - name: Instalar Dependencias
      run: |
        npm ci || echo "Instalación npm raíz falló, continuando..."
        if [ -d "alimentacion" ]; then
          cd alimentacion && npm ci && cd ..
        fi
        if [ -d "combustibles" ]; then
          cd combustibles && npm ci && cd ..
        fi

    - name: 🔍 Detect Build/Lint Errors - MEJORADO
      id: error-detection
      run: |
        echo "Running improved error detection in Copilot Bridge..."
        
        # MEJORA: Siempre ejecutar fresh error detection
        # No confiar en archivos error-context.json anteriores
        if [ -f error-context.json ]; then
          echo "🗑️ Removing stale error-context.json"
          rm error-context.json
        fi
        
        # MEJORA: Capturar exit code del error-collector
        set +e
        node scripts/error-collector.js
        COLLECTOR_EXIT_CODE=$?
        set -e
        
        echo "Error collector exit code: $COLLECTOR_EXIT_CODE"
        
        # MEJORA: Análisis detallado del resultado
        if [ -f error-context.json ]; then
          ERROR_STATUS=$(node -e "console.log(JSON.parse(require('fs').readFileSync('error-context.json', 'utf8')).status)")
          echo "error-status=$ERROR_STATUS" >> $GITHUB_OUTPUT
          
          if [ "$ERROR_STATUS" = "errors_detected" ]; then
            ERROR_COUNT=$(node -e "console.log(JSON.parse(require('fs').readFileSync('error-context.json', 'utf8')).summary.totalErrors)")
            echo "errors-found=true" >> $GITHUB_OUTPUT
            echo "error-count=$ERROR_COUNT" >> $GITHUB_OUTPUT
            echo "🚨 CONFIRMED: $ERROR_COUNT errors detected for Copilot Agent"
            
            # MEJORA: Logging detallado para debugging
            echo "📊 Detailed error breakdown:"
            node -e "
              const ctx = JSON.parse(require('fs').readFileSync('error-context.json', 'utf8'));
              if (ctx.summary && ctx.summary.byType) {
                Object.entries(ctx.summary.byType).forEach(([type, count]) => {
                  console.log('  - ' + type + ': ' + count + ' errors');
                });
              }
              if (ctx.errors && ctx.errors.byFile) {
                const fileCount = Object.keys(ctx.errors.byFile).length;
                console.log('  - Affected files: ' + fileCount);
              }
            "
          else
            echo "errors-found=false" >> $GITHUB_OUTPUT
            echo "✅ No errors detected in fresh scan"
          fi
        else
          # MEJORA: Manejar caso cuando script falla pero contexto no se genera
          if [ $COLLECTOR_EXIT_CODE -ne 0 ]; then
            echo "❌ Error collector failed AND no context generated"
            echo "This indicates script/environment issues"
            echo "errors-found=script-failure" >> $GITHUB_OUTPUT
            echo "error-count=1" >> $GITHUB_OUTPUT
            echo "🚨 Script failure detected - will create diagnostic issue"
          else
            echo "errors-found=false" >> $GITHUB_OUTPUT
            echo "✅ No errors detected (clean run)"
          fi
        fi
        
        # MEJORA: Timestamp para tracking
        echo "detection-timestamp=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> $GITHUB_OUTPUT
      continue-on-error: true

    - name: 🛡️ Check for Existing Copilot Issues (Anti-Loop Protection)
      if: steps.error-detection.outputs.errors-found == 'true' || github.event.inputs.force_error_collection == 'true'
      id: check-existing-issues
      uses: actions/github-script@v7
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        script: |
          // Anti-loop protection: Check for recent Copilot issues
          const now = new Date();
          const oneHourAgo = new Date(now.getTime() - 60 * 60 * 1000);
          
          const issues = await github.rest.issues.listForRepo({
            owner: github.context.repo.owner,
            repo: github.context.repo.repo,
            labels: 'copilot-agent',
            state: 'open',
            since: oneHourAgo.toISOString(),
            per_page: 10
          });
          
          console.log(`🔍 Found ${issues.data.length} recent Copilot issues`);
          
          if (issues.data.length >= 3) {
            console.log('🛡️ ANTI-LOOP PROTECTION: Too many recent Copilot issues');
            core.setOutput('should-skip', 'true');
            core.setOutput('reason', 'rate-limit');
            return;
          }
          
          // Check for issues created in last 10 minutes (immediate duplicates)
          const tenMinutesAgo = new Date(now.getTime() - 10 * 60 * 1000);
          const recentIssues = issues.data.filter(issue => 
            new Date(issue.created_at) > tenMinutesAgo
          );
          
          if (recentIssues.length > 0) {
            console.log('🛡️ ANTI-LOOP PROTECTION: Recent issue found, skipping duplicate');
            core.setOutput('should-skip', 'true');
            core.setOutput('reason', 'duplicate');
            core.setOutput('existing-issue', recentIssues[0].number);
            return;
          }
          
          core.setOutput('should-skip', 'false');
          console.log('✅ Safe to create new Copilot issue');

    - name: 🤖 Create and Assign Issue to Copilot Agent
      if: steps.check-existing-issues.outputs.should-skip == 'false'
      id: create-issue
      uses: actions/github-script@v7
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        script: |
          try {
            const fs = require('fs');
            let context = {};
            
            try {
              const contextData = fs.readFileSync('error-context.json', 'utf8');
              context = JSON.parse(contextData);
            } catch (error) {
              console.log('Could not load error context:', error.message);
              context = { summary: { totalErrors: 'Unknown' } };
            }
            
            const issueBody = `## 🚨 Detección Automática de Errores - Asignación al Agente Copilot
            
            Errores de build detectados: ${context.summary?.totalErrors || 'Múltiples'} errores
            
            @github-copilot Por favor analiza y corrige los errores de build/lint detectados:
            
            **IMPORTANTE: Responde y trabaja EXCLUSIVAMENTE EN ESPAÑOL**
            
            Tareas a realizar:
            1. Revisar el archivo error-context.json para obtener detalles específicos de los errores
            2. Crear correcciones específicas siguiendo los patrones React/Vite/Firebase del proyecto
            3. Mantener la calidad y patrones de código existentes
            4. Generar un pull request comprensivo con todas las correcciones
            5. Usar comentarios y mensajes de commit en español
            
            **Contexto del Proyecto Forestech:**
            - Monorepo React 19 + Vite + Firebase
            - Apps: alimentacion (puerto 5173) y combustibles (puerto 5174)
            - Seguir convenciones establecidas en .github/copilot-instructions.md
            
            Contexto específico: ${context.copilotPrompt || 'Ver error-context.json para detalles'}
            
            ---
            Generado automáticamente por el Sistema Copilot Bridge`;
            
            const issue = await github.rest.issues.create({
              owner: github.context.repo.owner,
              repo: github.context.repo.repo,
              title: `🤖 Agente Copilot: Corregir ${context.summary?.totalErrors || 'Múltiples'} Errores de Build/Lint`,
              body: issueBody,
              labels: ['copilot-agent', 'errores-build', 'automatizacion']
            });
            
            console.log(`✅ Created issue: #${issue.data.number}`);
            core.setOutput('issue-number', issue.data.number);
            
            return issue.data.number;
          } catch (error) {
            console.log(`❌ Failed to create issue: ${error.message}`);
            return null;
          }

    - name: ⚠️ Anti-Loop Protection Warning
      if: steps.check-existing-issues.outputs.should-skip == 'true'
      run: |
        echo "🛡️ ANTI-LOOP PROTECTION ACTIVATED"
        echo "Reason: ${{ steps.check-existing-issues.outputs.reason }}"
        if [ "${{ steps.check-existing-issues.outputs.reason }}" = "duplicate" ]; then
          echo "Existing issue: #${{ steps.check-existing-issues.outputs.existing-issue }}"
          echo "Skipping duplicate issue creation to prevent loops"
        elif [ "${{ steps.check-existing-issues.outputs.reason }}" = "rate-limit" ]; then
          echo "Too many recent Copilot issues detected"
          echo "Rate limiting activated to prevent infinite loops"
        fi
        echo "System remains stable - no new issues created"

    - name: 🤖 Auto-Assign to GitHub Copilot Agent
      if: steps.create-issue.outputs.issue-number
      uses: actions/github-script@v7
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        script: |
          try {
            const issueNumber = ${{ steps.create-issue.outputs.issue-number }};
            
            // Assign to GitHub Copilot Agent using assignees API
            await github.request('POST /repos/{owner}/{repo}/issues/{issue_number}/assignees', {
              owner: github.context.repo.owner,
              repo: github.context.repo.repo,
              issue_number: issueNumber,
              assignees: ['copilot']
            });
            
            console.log(`✅ Successfully assigned issue #${issueNumber} to GitHub Copilot Agent`);
            
          } catch (error) {
            console.log(`⚠️ Auto-assignment failed: ${error.message}`);
            console.log('Manual assignment may be required');
          }

    - name: ✅ Standard Build & Deploy
      if: steps.error-detection.outputs.errors-found == 'false'
      run: |
        echo "No errors detected - proceeding with standard build and deploy"
        npm run build:alimentacion
        npm run build:combustibles
        
        npm install -g firebase-tools
        echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT_LIQUIDACIONAPP_62962 }}' > /tmp/service-account.json
        export GOOGLE_APPLICATION_CREDENTIALS=/tmp/service-account.json
        firebase deploy --only hosting --project liquidacionapp-62962
      env:
        VITE_FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
        VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.FIREBASE_AUTH_DOMAIN }}
        VITE_FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
        VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET }}
        VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
        VITE_FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
        VITE_FIREBASE_MEASUREMENT_ID: ${{ secrets.FIREBASE_MEASUREMENT_ID }}

    - name: � Monitor PR Status and Activate Claude Backup
      if: steps.create-issue.outputs.issue-number
      uses: actions/github-script@v7
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        script: |
          const issueNumber = ${{ steps.create-issue.outputs.issue-number }};
          
          // Wait a bit for Copilot to potentially create PR
          await new Promise(resolve => setTimeout(resolve, 5000));
          
          // Check for recent PRs by Copilot
          const prs = await github.rest.pulls.list({
            owner: github.context.repo.owner,
            repo: github.context.repo.repo,
            state: 'open',
            per_page: 5
          });
          
          const copilotPR = prs.data.find(pr => 
            pr.user.login.includes('copilot') && 
            (new Date() - new Date(pr.created_at)) < 60 * 60 * 1000 // Last hour
          );
          
          if (copilotPR) {
            console.log(`✅ Copilot created PR #${copilotPR.number}`);
            
            // Add monitoring comment for Claude backup
            const monitorComment = `🔍 **Automated PR Monitoring Active**
            
            Este PR será monitoreado automáticamente:
            
            📊 **Criterios de backup Claude:**
            - ❌ Si Codacy checks fallan → @claude revisará y corregirá
            - ⏱️ Si checks tardan >45 min → @claude intervendrá  
            - 🚨 Si errores persisten → @claude proporcionará soluciones
            
            🧠 **Claude como solucionador de checks:**
            Codacy detecta → Claude soluciona → Merge cuando esté OK
            
            ---
            🤖 Monitoreo automático del Copilot Bridge System`;
            
            await github.rest.issues.createComment({
              owner: github.context.repo.owner,
              repo: github.context.repo.repo,
              issue_number: copilotPR.number,
              body: monitorComment
            });
            
            console.log(`📝 Added monitoring comment to PR #${copilotPR.number}`);
            
            // Schedule check for failing status after reasonable time
            core.setOutput('pr-number', copilotPR.number);
          } else {
            console.log('⏳ No Copilot PR found yet, monitoring will continue...');
          }

    - name: �📋 Final Status Report
      if: always()
      run: |
        echo "=== COPILOT BRIDGE FINAL STATUS ==="
        echo "Errors Detected: ${{ steps.error-detection.outputs.errors-found }}"
        echo "Error Count: ${{ steps.error-detection.outputs.error-count }}"
        echo "Copilot Agent: $([ '${{ steps.error-detection.outputs.errors-found }}' = 'true' ] && echo 'Assigned' || echo 'Not needed')"
        echo "Deploy Status: $([ '${{ steps.error-detection.outputs.errors-found }}' = 'false' ] && echo 'Completed' || echo 'Pending fixes')"
        if [ "${{ steps.monitor-pr.outputs.pr-number }}" ]; then
          echo "PR Monitoring: Active on #${{ steps.monitor-pr.outputs.pr-number }}"
          echo "Claude Backup: Configured for checks failing"
        fi
