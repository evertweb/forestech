name: 🚀 Deploy to Cloud Run

on:
  push:
    branches:
      - main
    paths:
      - 'functions/**'
      - 'combustibles/src/services/**'
      - '.github/workflows/deploy-cloud-run.yml'

env:
  NODE_VERSION: '20'
  GCLOUD_PROJECT: 'liquidacionapp-62962'
  GCLOUD_REGION: 'us-central1'
  SERVICE_NAME: 'forestech-sql-service'

jobs:
  deploy-cloud-run:
    name: 🚀 Deploy Cloud Run
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 📋 Checkout
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: functions/package-lock.json

      - name: 🔐 Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: ⚙️ Setup Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.GCLOUD_PROJECT }}

      - name: 📦 Install dependencies
        run: |
          cd functions
          npm ci --prefer-offline --no-audit --no-fund

      - name: 🏗️ Build and Deploy to Cloud Run
        run: |
          echo "🚀 Deploying to Cloud Run..."
          gcloud run deploy ${{ env.SERVICE_NAME }} \
            --source . \
            --platform managed \
            --region ${{ env.GCLOUD_REGION }} \
            --project ${{ env.GCLOUD_PROJECT }} \
            --allow-unauthenticated \
            --memory 512Mi \
            --cpu 1 \
            --max-instances 10 \
            --port 8080 \
            --set-env-vars="NODE_ENV=production" \
            --set-env-vars="FIREBASE_PROJECT_ID=${{ env.GCLOUD_PROJECT }}" \
            --set-env-vars="GCLOUD_PROJECT=${{ env.GCLOUD_PROJECT }}"

      - name: ✅ Verify Deployment
        run: |
          echo "🔍 Verifying deployment..."
          SERVICE_URL=$(gcloud run services describe ${{ env.SERVICE_NAME }} \
            --region ${{ env.GCLOUD_REGION }} \
            --project ${{ env.GCLOUD_PROJECT }} \
            --format="value(status.url)")

          echo "🌐 Service URL: $SERVICE_URL"

          # Test health endpoint
          if curl -f "$SERVICE_URL/health" > /dev/null 2>&1; then
            echo "✅ Health check passed!"
          else
            echo "❌ Health check failed!"
            exit 1
          fi

      - name: 📊 Deployment Summary
        if: always()
        run: |
          echo "📊 Deployment Summary:"
          echo "🏷️ Service: ${{ env.SERVICE_NAME }}"
          echo "🌐 URL: $(gcloud run services describe ${{ env.SERVICE_NAME }} --region ${{ env.GCLOUD_REGION }} --project ${{ env.GCLOUD_PROJECT }} --format='value(status.url)')"
          echo "📍 Region: ${{ env.GCLOUD_REGION }}"
          echo "📦 Memory: 512Mi"
          echo "⚡ CPU: 1"
          echo "🔄 Max Instances: 10"
          echo "✅ Deployment completed!"