name: 🚀 Deploy to Cloud Run

on:
  workflow_dispatch:         # Solo deploy manual
    inputs:
      force_deploy:
        description: 'Confirmar deploy to Cloud Run (requiere permisos storage.admin)'
        required: true
        default: false
        type: boolean

env:
  NODE_VERSION: '20'
  GCLOUD_PROJECT: 'liquidacionapp-62962'
  GCLOUD_REGION: 'us-central1'
  SERVICE_NAME: 'forestech-sql-service'

jobs:
  deploy-cloud-run:
    name: 🚀 Deploy Cloud Run
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 📋 Checkout
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: functions/package-lock.json

      - name: 🔐 Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_LIQUIDACIONAPP_62962 }}

      - name: ⚙️ Setup Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ env.GCLOUD_PROJECT }}

      - name: 📦 Install dependencies
        run: |
          cd functions
          npm ci --prefer-offline --no-audit --no-fund

      - name: 🏗️ Build and Deploy to Cloud Run
        if: github.event.inputs.force_deploy == 'true'
        run: |
          echo "🚀 Deploying to Cloud Run..."
          echo "⚠️ NOTA: Este deploy requiere permisos adicionales:"
          echo "   - roles/run.admin"
          echo "   - roles/storage.admin" 
          echo "   - roles/cloudbuild.builds.builder"
          echo ""
          cd functions
          gcloud run deploy ${{ env.SERVICE_NAME }} \
            --source . \
            --platform managed \
            --region ${{ env.GCLOUD_REGION }} \
            --project ${{ env.GCLOUD_PROJECT }} \
            --allow-unauthenticated \
            --memory 512Mi \
            --cpu 1 \
            --max-instances 10 \
            --port 8080 \
            --set-env-vars="NODE_ENV=production" \
            --set-env-vars="FIREBASE_PROJECT_ID=${{ env.GCLOUD_PROJECT }}" \
            --set-env-vars="GCLOUD_PROJECT=${{ env.GCLOUD_PROJECT }}"

      - name: ℹ️ Permisos Requeridos
        if: github.event.inputs.force_deploy != 'true'
        run: |
          echo "⚠️ Deploy Cloud Run deshabilitado por falta de permisos."
          echo ""
          echo "🔧 Para habilitar, el service account necesita estos roles:"
          echo "   • roles/run.admin                   (Cloud Run Admin)"
          echo "   • roles/storage.admin               (Cloud Storage Admin)"
          echo "   • roles/cloudbuild.builds.builder   (Cloud Build Service Account)"
          echo "   • roles/iam.serviceAccountUser      (Service Account User)"
          echo ""
          echo "📋 Service Account actual:"
          echo "   github-action-1002035008@liquidacionapp-62962.iam.gserviceaccount.com"
          echo ""
          echo "🌐 Cloud Run actual funcionando en:"
          echo "   https://forestech-sql-service-851382130132.us-central1.run.app/"
          echo ""
          echo "💡 Mientras tanto, Cloud Run sigue funcionando con el deploy anterior."

      - name: ✅ Verify Deployment
        if: github.event.inputs.force_deploy == 'true'
        run: |
          echo "🔍 Verifying deployment..."
          SERVICE_URL=$(gcloud run services describe ${{ env.SERVICE_NAME }} \
            --region ${{ env.GCLOUD_REGION }} \
            --project ${{ env.GCLOUD_PROJECT }} \
            --format="value(status.url)")

          echo "🌐 Service URL: $SERVICE_URL"

          # Test health endpoint
          if curl -f "$SERVICE_URL/health" > /dev/null 2>&1; then
            echo "✅ Health check passed!"
          else
            echo "❌ Health check failed!"
            exit 1
          fi

      - name: 📊 Deployment Summary
        if: always()
        run: |
          echo "📊 Deployment Summary:"
          echo "🏷️ Service: ${{ env.SERVICE_NAME }}"
          echo "🌐 URL: $(gcloud run services describe ${{ env.SERVICE_NAME }} --region ${{ env.GCLOUD_REGION }} --project ${{ env.GCLOUD_PROJECT }} --format='value(status.url)')"
          echo "📍 Region: ${{ env.GCLOUD_REGION }}"
          echo "📦 Memory: 512Mi"
          echo "⚡ CPU: 1"
          echo "🔄 Max Instances: 10"
          echo "✅ Deployment completed!"