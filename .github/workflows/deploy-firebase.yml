name: Deploy Forestech to Firebase (Simplified - No Validations)

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  NODE_VERSION: '18'

jobs:
  # 🚀 JOB ÚNICO: Direct Build & Deploy (Sin validaciones)
  build-and-deploy:
    name: Build & Deploy (No Validations)
    runs-on: ubuntu-latest
    steps:
      - name: 📋 Checkout Repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: 📦 Install Dependencies
        run: npm ci

      - name: 🏗️ Build Alimentacion
        run: npm run build --workspace=alimentacion
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"

      - name: 🏗️ Build Combustibles  
        run: npm run build --workspace=combustibles
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"

      - name: 📁 Verify Build Output
        run: |
          echo "✅ Build verification:"
          ls -la public/
          echo "📁 Alimentacion files:"
          ls -la public/alimentacion/ | head -10
          echo "📁 Combustibles files:"
          ls -la public/combustibles/ | head -10

      - name: 🔧 Install Firebase CLI
        run: npm install -g firebase-tools

      - name: 🚀 Deploy to Firebase
        run: |
          echo "🚀 Ejecutando deploy directo (sin validaciones)..."
          firebase deploy --only hosting --project liquidacionapp-62962 --token "${{ secrets.FIREBASE_TOKEN }}"

      - name: 🎉 Deployment Success
        if: success()
        run: |
          echo "🎉 Deploy exitoso sin validaciones!"
          echo "🍽️ Alimentacion: https://forestechdecolombia.com.co/alimentacion/"
          echo "⛽ Combustibles: https://forestechdecolombia.com.co/combustibles/"
          echo ""
          echo "⚡ Modo simplificado activado:"
          echo "  - ❌ Sin error detection"
          echo "  - ❌ Sin lint checks" 
          echo "  - ❌ Sin circuit breaker"
          echo "  - ❌ Sin Copilot Bridge"
          echo "  - ✅ Deploy directo tras build exitoso"
          echo ""
          echo "💡 Recuerda: Tú te encargas del lint y testing local"