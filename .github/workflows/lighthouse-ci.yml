name: 🔦 Lighthouse CI

on:
  pull_request:
    branches: [main]
    paths:
      - 'combustibles/**'
      - 'alimentacion/**'
      - 'public/**'
      - '.github/workflows/lighthouse-ci.yml'
  workflow_dispatch:
    inputs:
      target:
        description: 'App a auditar'
        required: true
        default: 'combustibles'
        type: choice
        options:
          - combustibles
          - alimentacion
          - both

env:
  NODE_VERSION: '20'
  # Thresholds para Lighthouse scores (0-100)
  PERF_THRESHOLD: 90
  ACCESSIBILITY_THRESHOLD: 90
  BEST_PRACTICES_THRESHOLD: 90
  SEO_THRESHOLD: 90

jobs:
  lighthouse-combustibles:
    name: 🔦 Lighthouse - Combustibles
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: |
      github.event_name == 'pull_request' || 
      github.event.inputs.target == 'combustibles' || 
      github.event.inputs.target == 'both'
    
    steps:
      - name: 📋 Checkout
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: 📦 Install dependencies
        run: |
          npm ci --prefer-offline --no-audit --no-fund

      - name: 🏗️ Build Combustibles
        run: npm run build:combustibles
        env:
          NODE_OPTIONS: "--max-old-space-size=2048"
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: liquidacionapp-62962.firebaseapp.com
          VITE_FIREBASE_PROJECT_ID: liquidacionapp-62962
          VITE_FIREBASE_STORAGE_BUCKET: liquidacionapp-62962.firebasestorage.app
          VITE_FIREBASE_MESSAGING_SENDER_ID: 851382130132
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_MEASUREMENT_ID: ${{ secrets.VITE_FIREBASE_MEASUREMENT_ID }}

      - name: 📦 Install Lighthouse CI
        run: npm install -g @lhci/cli@0.13.x

      - name: 🚀 Start preview server
        run: |
          cd combustibles
          npx vite preview --port 4173 --strictPort &
          echo "Waiting for server to be ready..."
          for i in {1..30}; do
            if curl -s http://localhost:4173/combustibles/ > /dev/null; then
              echo "✅ Server is ready"
              break
            fi
            echo "⏳ Waiting... ($i/30)"
            sleep 2
          done

      - name: 🔦 Run Lighthouse CI (Desktop)
        run: |
          lhci autorun --config=lighthouserc-desktop.json || true
        env:
          LHCI_BUILD_CONTEXT__CURRENT_HASH: ${{ github.sha }}
          LHCI_BUILD_CONTEXT__CURRENT_BRANCH: ${{ github.ref_name }}

      - name: 🔦 Run Lighthouse CI (Mobile)
        run: |
          lhci autorun --config=lighthouserc-mobile.json || true
        env:
          LHCI_BUILD_CONTEXT__CURRENT_HASH: ${{ github.sha }}
          LHCI_BUILD_CONTEXT__CURRENT_BRANCH: ${{ github.ref_name }}

      - name: 📊 Parse Lighthouse results
        id: parse_results
        run: |
          # Parsear resultados de Desktop
          DESKTOP_REPORT=$(ls .lighthouseci/lh-*-desktop.json | head -1)
          if [ -f "$DESKTOP_REPORT" ]; then
            DESKTOP_PERF=$(jq '.categories.performance.score * 100 | floor' "$DESKTOP_REPORT")
            DESKTOP_A11Y=$(jq '.categories.accessibility.score * 100 | floor' "$DESKTOP_REPORT")
            DESKTOP_BP=$(jq '.categories."best-practices".score * 100 | floor' "$DESKTOP_REPORT")
            DESKTOP_SEO=$(jq '.categories.seo.score * 100 | floor' "$DESKTOP_REPORT")
            echo "desktop_perf=$DESKTOP_PERF" >> $GITHUB_OUTPUT
            echo "desktop_a11y=$DESKTOP_A11Y" >> $GITHUB_OUTPUT
            echo "desktop_bp=$DESKTOP_BP" >> $GITHUB_OUTPUT
            echo "desktop_seo=$DESKTOP_SEO" >> $GITHUB_OUTPUT
          fi

          # Parsear resultados de Mobile
          MOBILE_REPORT=$(ls .lighthouseci/lh-*-mobile.json | head -1)
          if [ -f "$MOBILE_REPORT" ]; then
            MOBILE_PERF=$(jq '.categories.performance.score * 100 | floor' "$MOBILE_REPORT")
            MOBILE_A11Y=$(jq '.categories.accessibility.score * 100 | floor' "$MOBILE_REPORT")
            MOBILE_BP=$(jq '.categories."best-practices".score * 100 | floor' "$MOBILE_REPORT")
            MOBILE_SEO=$(jq '.categories.seo.score * 100 | floor' "$MOBILE_REPORT")
            echo "mobile_perf=$MOBILE_PERF" >> $GITHUB_OUTPUT
            echo "mobile_a11y=$MOBILE_A11Y" >> $GITHUB_OUTPUT
            echo "mobile_bp=$MOBILE_BP" >> $GITHUB_OUTPUT
            echo "mobile_seo=$MOBILE_SEO" >> $GITHUB_OUTPUT
          fi

      - name: 📋 Create Lighthouse summary
        run: |
          cat >> $GITHUB_STEP_SUMMARY << 'EOF'
          ## 🔦 Lighthouse CI Results - Combustibles
          
          ### Desktop Scores
          | Category | Score | Threshold | Status |
          |----------|-------|-----------|--------|
          | 🚀 Performance | ${{ steps.parse_results.outputs.desktop_perf }}/100 | ≥${{ env.PERF_THRESHOLD }} | ${{ steps.parse_results.outputs.desktop_perf >= env.PERF_THRESHOLD && '✅' || '❌' }} |
          | ♿ Accessibility | ${{ steps.parse_results.outputs.desktop_a11y }}/100 | ≥${{ env.ACCESSIBILITY_THRESHOLD }} | ${{ steps.parse_results.outputs.desktop_a11y >= env.ACCESSIBILITY_THRESHOLD && '✅' || '❌' }} |
          | 🏆 Best Practices | ${{ steps.parse_results.outputs.desktop_bp }}/100 | ≥${{ env.BEST_PRACTICES_THRESHOLD }} | ${{ steps.parse_results.outputs.desktop_bp >= env.BEST_PRACTICES_THRESHOLD && '✅' || '❌' }} |
          | 🔍 SEO | ${{ steps.parse_results.outputs.desktop_seo }}/100 | ≥${{ env.SEO_THRESHOLD }} | ${{ steps.parse_results.outputs.desktop_seo >= env.SEO_THRESHOLD && '✅' || '❌' }} |
          
          ### Mobile Scores
          | Category | Score | Threshold | Status |
          |----------|-------|-----------|--------|
          | 🚀 Performance | ${{ steps.parse_results.outputs.mobile_perf }}/100 | ≥${{ env.PERF_THRESHOLD }} | ${{ steps.parse_results.outputs.mobile_perf >= env.PERF_THRESHOLD && '✅' || '❌' }} |
          | ♿ Accessibility | ${{ steps.parse_results.outputs.mobile_a11y }}/100 | ≥${{ env.ACCESSIBILITY_THRESHOLD }} | ${{ steps.parse_results.outputs.mobile_a11y >= env.ACCESSIBILITY_THRESHOLD && '✅' || '❌' }} |
          | 🏆 Best Practices | ${{ steps.parse_results.outputs.mobile_bp }}/100 | ≥${{ env.BEST_PRACTICES_THRESHOLD }} | ${{ steps.parse_results.outputs.mobile_bp >= env.BEST_PRACTICES_THRESHOLD && '✅' || '❌' }} |
          | 🔍 SEO | ${{ steps.parse_results.outputs.mobile_seo }}/100 | ≥${{ env.SEO_THRESHOLD }} | ${{ steps.parse_results.outputs.mobile_seo >= env.SEO_THRESHOLD && '✅' || '❌' }} |
          EOF

      - name: ✅ Validate scores against thresholds
        run: |
          FAILED=0
          
          # Validar Desktop
          if [ "${{ steps.parse_results.outputs.desktop_perf }}" -lt "${{ env.PERF_THRESHOLD }}" ]; then
            echo "❌ Desktop Performance score below threshold"
            FAILED=1
          fi
          if [ "${{ steps.parse_results.outputs.desktop_a11y }}" -lt "${{ env.ACCESSIBILITY_THRESHOLD }}" ]; then
            echo "❌ Desktop Accessibility score below threshold"
            FAILED=1
          fi
          if [ "${{ steps.parse_results.outputs.desktop_bp }}" -lt "${{ env.BEST_PRACTICES_THRESHOLD }}" ]; then
            echo "❌ Desktop Best Practices score below threshold"
            FAILED=1
          fi
          if [ "${{ steps.parse_results.outputs.desktop_seo }}" -lt "${{ env.SEO_THRESHOLD }}" ]; then
            echo "❌ Desktop SEO score below threshold"
            FAILED=1
          fi
          
          # Validar Mobile
          if [ "${{ steps.parse_results.outputs.mobile_perf }}" -lt "${{ env.PERF_THRESHOLD }}" ]; then
            echo "❌ Mobile Performance score below threshold"
            FAILED=1
          fi
          if [ "${{ steps.parse_results.outputs.mobile_a11y }}" -lt "${{ env.ACCESSIBILITY_THRESHOLD }}" ]; then
            echo "❌ Mobile Accessibility score below threshold"
            FAILED=1
          fi
          if [ "${{ steps.parse_results.outputs.mobile_bp }}" -lt "${{ env.BEST_PRACTICES_THRESHOLD }}" ]; then
            echo "❌ Mobile Best Practices score below threshold"
            FAILED=1
          fi
          if [ "${{ steps.parse_results.outputs.mobile_seo }}" -lt "${{ env.SEO_THRESHOLD }}" ]; then
            echo "❌ Mobile SEO score below threshold"
            FAILED=1
          fi
          
          if [ $FAILED -eq 1 ]; then
            echo "🔥 Lighthouse CI failed - scores below thresholds"
            exit 1
          fi
          
          echo "✅ All Lighthouse scores meet thresholds!"

      - name: 📦 Upload Lighthouse reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighthouse-reports-combustibles-${{ github.run_id }}
          path: |
            .lighthouseci/
          retention-days: 30

  lighthouse-alimentacion:
    name: 🔦 Lighthouse - Alimentación
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: |
      github.event.inputs.target == 'alimentacion' || 
      github.event.inputs.target == 'both'
    
    steps:
      - name: 📋 Checkout
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: 🏗️ Build Alimentación
        run: npm run build:alimentacion
        env:
          NODE_OPTIONS: "--max-old-space-size=2048"

      - name: 📦 Install Lighthouse CI
        run: npm install -g @lhci/cli@0.13.x

      - name: 🚀 Start preview server
        run: |
          cd alimentacion
          npx vite preview --port 4174 --strictPort &
          echo "Waiting for server..."
          for i in {1..30}; do
            if curl -s http://localhost:4174/alimentacion/ > /dev/null; then
              echo "✅ Server ready"
              break
            fi
            sleep 2
          done

      - name: 🔦 Run Lighthouse CI
        run: |
          lhci autorun --collect.url=http://localhost:4174/alimentacion/ \
            --collect.numberOfRuns=3 \
            --assert.preset=lighthouse:recommended

      - name: 📦 Upload Lighthouse reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighthouse-reports-alimentacion-${{ github.run_id }}
          path: .lighthouseci/
          retention-days: 30
