name: 🚀 Prebuild Maintenance

# Workflow para mantener prebuilds actualizados automáticamente
on:
  schedule:
    # Ejecutar diariamente a las 2 AM UTC (mantener prebuilds frescos)
    - cron: '0 2 * * *'
  
  workflow_dispatch:
    # Permitir ejecución manual
    
  push:
    branches: [ main ]
    paths:
      # Solo ejecutar si cambian archivos relevantes para prebuilds
      - '.devcontainer/**'
      - 'combustibles/package*.json'
      - 'alimentacion/package*.json'
      - 'firebase.json'

jobs:
  update-prebuild-info:
    name: 📊 Update Prebuild Info
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
        
      - name: 📊 Update prebuild metrics
        run: |
          echo "# 📊 Prebuild Status - $(date)" > .devcontainer/prebuild-status.md
          echo "" >> .devcontainer/prebuild-status.md
          echo "- **Última actualización:** $(date)" >> .devcontainer/prebuild-status.md
          echo "- **Trigger:** ${{ github.event_name }}" >> .devcontainer/prebuild-status.md
          echo "- **Branch:** ${{ github.ref_name }}" >> .devcontainer/prebuild-status.md
          echo "" >> .devcontainer/prebuild-status.md
          echo "## 🎯 Configuración Actual" >> .devcontainer/prebuild-status.md
          echo "- **Base Image:** \`node:20-bullseye\`" >> .devcontainer/prebuild-status.md
          echo "- **Prebuild Script:** \`.devcontainer/setup-prebuild.sh\`" >> .devcontainer/prebuild-status.md
          echo "- **Apps incluidas:** Combustibles, Alimentación" >> .devcontainer/prebuild-status.md
          echo "- **Tools globales:** Firebase CLI" >> .devcontainer/prebuild-status.md
          
      - name: 💾 Commit status update
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add .devcontainer/prebuild-status.md
          git diff --staged --quiet || git commit -m "📊 Update prebuild status - $(date)"
          git push || true

  notify-prebuild-ready:
    name: 🔔 Notify Prebuild Ready  
    runs-on: ubuntu-latest
    needs: update-prebuild-info
    if: github.event_name == 'push'
    
    steps:
      - name: 📢 Notify
        run: |
          echo "🎉 Prebuild configuration updated!"
          echo "✅ Ready to configure prebuild in GitHub Settings"
          echo "📍 Go to: Settings → Codespaces → Set up prebuild"