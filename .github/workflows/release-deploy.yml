name: 🚀 Deploy Landing

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'public/**'
      - 'firebase.json'
      - '.github/workflows/release-deploy.yml'
      - 'README.md'

env:
  NODE_VERSION: '20'
  FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

jobs:
  deploy:
    name: 🚀 Deploy Hosting
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 📋 Checkout (full)
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: 📦 Instalar dependencias
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: 🏗️ Verificar landing
        run: npm run build

      # 🔧 SETUP FIREBASE CLI
      - name: 🔧 Setup Firebase CLI
        run: |
          npm install -g firebase-tools@13.33.0
          firebase --version

      - name: 🔐 Configure Firebase service account
        if: env.FIREBASE_SERVICE_ACCOUNT != ''
        run: |
          echo "$FIREBASE_SERVICE_ACCOUNT" > $RUNNER_TEMP/firebase-key.json
          chmod 600 $RUNNER_TEMP/firebase-key.json
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/firebase-key.json" >> $GITHUB_ENV

      # 🚀 DEPLOY TO FIREBASE
      - name: 🚀 Deploy a Firebase Hosting
        run: |
          echo "🚀 Deploying landing..."
          firebase deploy --only "hosting:forestechdecolombia,hosting:combustibles-subdomain" --json --debug | tee deploy-result.json

          if grep -q '"status": "success"' deploy-result.json; then
            echo "✅ Deploy successful!"
            echo "DEPLOY_OUTCOME=success" >> $GITHUB_ENV
          else
            echo "❌ Deploy failed!"
            cat deploy-result.json
            if [ -f firebase-debug.log ]; then
              echo "----- firebase-debug.log -----"
              cat firebase-debug.log
            fi
            echo "DEPLOY_OUTCOME=failure" >> $GITHUB_ENV
            exit 1
          fi

      # 📊 DEPLOYMENT SUMMARY
      - name: 📊 Deployment Summary
        if: always()
        run: |
          echo "📊 Deploy Summary:"
          echo "🌐 URLs desplegados:"
          echo "  🌲 https://forestechdecolombia.com.co/"
          echo "  ⛽ https://combustibles.forestechdecolombia.com.co/"
          
          if [ "${DEPLOY_OUTCOME:-unknown}" = "success" ]; then
            echo "✅ Firebase deploy completado sin errores."
          else
            echo "⚠️ Firebase deploy fallido, revisar logs previos."
          fi

      - name: 📎 firebase-debug.log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: firebase-debug-log
          path: firebase-debug.log
          if-no-files-found: ignore