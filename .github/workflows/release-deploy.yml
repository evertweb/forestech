name: 🚀 Release Deploy to Firebase

on:
  push:
    branches:
      - main

env:
  NODE_VERSION: '20'
  # Cache keys basados en contenido de archivos críticos
  CACHE_KEY_PREFIX: v2-forestech-release

jobs:
  # 🚀 RELEASE DEPLOY - FULL BUILD & DEPLOY
  release-deploy:
    name: 🚀 Release Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: 📋 Checkout (full)
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js with caching
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            alimentacion/package-lock.json
            combustibles/package-lock.json

      # 📦 INSTALL DEPENDENCIES
      - name: 📦 Install dependencies
        run: |
          echo "📦 Installing dependencies..."
          npm ci --prefer-offline --no-audit --no-fund

      # 🏗️ FULL BUILD BOTH APPS
      - name: 🍽️ Build Alimentacion
        run: |
          echo "🍽️ Building Alimentacion..."
          npm run build:alimentacion
        env:
          NODE_OPTIONS: "--max-old-space-size=2048"

      - name: ⛽ Build Combustibles
        run: |
          echo "⛽ Building Combustibles..."
          npm run build:combustibles
        env:
          NODE_OPTIONS: "--max-old-space-size=2048"
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: liquidacionapp-62962.firebaseapp.com
          VITE_FIREBASE_PROJECT_ID: liquidacionapp-62962
          VITE_FIREBASE_STORAGE_BUCKET: liquidacionapp-62962.firebasestorage.app
          VITE_FIREBASE_MESSAGING_SENDER_ID: 851382130132
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_MEASUREMENT_ID: ${{ secrets.VITE_FIREBASE_MEASUREMENT_ID }}

      # 🔧 SETUP FIREBASE CLI
      - name: 🔧 Setup Firebase CLI
        run: |
          npm install -g firebase-tools@13.0.0
          firebase --version

      # 🔑 AUTHENTICATE FIREBASE
      - name: 🔑 Authenticate Firebase
        run: |
          echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT_LIQUIDACIONAPP_62962 }}' > /tmp/service-account.json
          firebase use liquidacionapp-62962 --token ${{ secrets.FIREBASE_TOKEN }}

      # 🚀 DEPLOY TO FIREBASE
      - name: 🚀 Deploy to Firebase (full)
        run: |
          echo "🚀 Deploying release to Firebase..."
          firebase deploy --only hosting --token ${{ secrets.FIREBASE_TOKEN }} --json | tee deploy-result.json

          # Mostrar resultado
          if grep -q '"status": "success"' deploy-result.json; then
            echo "✅ Release deploy successful!"
            echo "🌟 Release ${{ github.event.release.tag_name || github.ref_name }} deployed!"
          else
            echo "❌ Release deploy failed!"
            cat deploy-result.json
            exit 1
          fi

      # 📊 RELEASE METRICS
      - name: 📊 Release Performance Metrics
        if: always()
        run: |
          echo "📊 Release Deploy Summary:"
          echo "🏷️ Release: ${{ github.event.release.tag_name || github.ref_name }}"
          echo "⏱️ Deploy time: ${{ job.started_at }} to $(date)"
          echo "📦 Bundle sizes:"
          [ -d "public/alimentacion" ] && echo "  🍽️ Alimentacion: $(du -sh public/alimentacion/ | cut -f1)"
          [ -d "public/combustibles" ] && echo "  ⛽ Combustibles: $(du -sh public/combustibles/ | cut -f1)"
          echo "✅ Release deployed successfully to production!"

      # 🔔 NOTIFICATION (opcional)
      - name: 📢 Notify Release Deploy
        if: success()
        run: |
          echo "🎉 Release ${{ github.event.release.tag_name || github.ref_name }} successfully deployed!"
          # Aquí puedes agregar notificaciones a Slack, Discord, etc.