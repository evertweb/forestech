<!DOCTYPE html>
<html lang="es-CO">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calendario de Tarjeta de Crédito - Colombia</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>Calendario de Tarjeta de Crédito - Colombia</h1>

        <div class="config-panel">
            <div class="config-item">
                <label for="fechaCorte">Fecha de Corte:</label>
                <input type="number" id="fechaCorte" min="1" max="31" value="1">
            </div>
            <div class="config-item">
                <label for="fechaPago">Fecha de Pago:</label>
                <input type="number" id="fechaPago" min="1" max="31" value="14">
            </div>
            <button onclick="actualizarCalendario()" class="nav-button">Aplicar Cambios</button>
        </div>

        <div class="navigation">
            <button class="nav-button" onclick="cambiarMes(-1)" aria-label="Mes anterior">◀ Mes Anterior</button>
            <div class="month-year" id="monthYear"></div>
            <button class="nav-button" onclick="cambiarMes(1)" id="siguienteMes" aria-label="Mes siguiente">Mes Siguiente ▶</button>
        </div>

        <div class="calendar" id="calendar" role="grid"></div>

        <div class="leyenda">
            <div class="leyenda-item">
                <div class="color-box categoria-mejor"></div>
                <span>🟢 Mejores días (máximo plazo)</span>
            </div>
            <div class="leyenda-item">
                <div class="color-box categoria-intermedio"></div>
                <span>🟡 Días intermedios</span>
            </div>
            <div class="leyenda-item">
                <div class="color-box categoria-peor"></div>
                <span>🔴 Peores días (menos plazo)</span>
            </div>
            <div class="leyenda-item">
                <span>📌 Día de Corte</span>
            </div>
            <div class="leyenda-item">
                <span>💳 Día de Pago</span>
            </div>
            <div class="leyenda-item">
                <div class="color-box" style="background: var(--color-festivo);"></div>
                <span>Día Festivo</span>
            </div>
            <div class="leyenda-item">
                <div class="color-box" style="background: var(--color-hoy); opacity: 0.3;"></div>
                <span>Día Actual</span>
            </div>
        </div>
    </div>

    <div class="tooltip" id="tooltip"></div>

    <script src="script.js"></script>
</body>
</html>
