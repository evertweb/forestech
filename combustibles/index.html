<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>forestech de Colombia</title>
    <!-- Preconnects para reducir TTFB/LCP en fuentes y Firebase -->
    <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://www.gstatic.com" crossorigin>
  <!-- Preconnect a Firebase Storage para acelerar DNS/TLS (sin forzar credentials) -->
  <link rel="preconnect" href="https://firebasestorage.googleapis.com">
  <link rel="preconnect" href="https://storage.googleapis.com">
  <link rel="preconnect" href="https://identitytoolkit.googleapis.com" crossorigin>
  <link rel="preconnect" href="https://securetoken.googleapis.com" crossorigin>
    
    <!-- Preload imagen de fondo crítica para LCP -->
    <link rel="preload" as="image" href="https://firebasestorage.googleapis.com/v0/b/liquidacionapp-62962.appspot.com/o/backgrounds%2Fdefault%2Flogin-bg.jpg?alt=media" fetchpriority="high">
    
    <!-- DNS prefetch adicional para optimizar Firebase y auth -->
    <link rel="dns-prefetch" href="//firebaseapp.com">
    <link rel="dns-prefetch" href="//firebase-storage-download">
    
    <!-- Opcional: si se usan fuentes de Google en runtime, precargar hoja -->
    <!-- <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@300;400;600;700&display=swap"> -->
    <!-- CSS crítico above-the-fold para Dashboard y Movements -->
    <style>
      /* Shell del layout para evitar CLS inicial */
      html, body, #root { height: 100%; }
      .dashboard-header { height: 70px; background: linear-gradient(135deg, #2d5a27 0%, #1e3a1a 100%); position: fixed; top: 0; left: 0; right: 0; z-index: 1000; }
      .dashboard-body { min-height: calc(100vh - 70px); margin-top: 70px; }
      .user-avatar { width: 40px; height: 40px; border-radius: 50%; }
      
      /* Variables SAP críticas */
      :root {
        --sap-neutral-100: #ffffff; --sap-neutral-200: #f7f7f7; --sap-neutral-300: #ededed;
        --sap-text-primary: #32363a; --sap-text-secondary: #6a6d70;
        --sap-success: #30914f; --sap-warning: #df6e00; --sap-error: #dc0d0e; --sap-blue-primary: #0070f2;
        --sap-shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.12); --sap-spacing-lg: 24px; --sap-spacing-md: 16px;
      }

      /* Stats grid crítico (Dashboard above-the-fold) */
      .stats-grid.sap-theme { 
        display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); 
        gap: var(--sap-spacing-lg); margin-bottom: 32px; 
      }
      .stat-card.sap-theme { 
        background: var(--sap-neutral-100); border: 1px solid var(--sap-neutral-300); 
        border-radius: 8px; box-shadow: var(--sap-shadow-sm); padding: var(--sap-spacing-lg);
        position: relative; min-height: 120px;
      }
      .stat-card.sap-theme::before { 
        content: ''; position: absolute; top: 0; left: 0; width: 4px; height: 100%; 
        background: var(--sap-blue-primary); 
      }
      .stat-card.sap-theme.success::before { background: var(--sap-success); }
      .stat-card.sap-theme.error::before { background: var(--sap-error); }
      .stat-card-header.sap-theme { display: flex; align-items: center; justify-content: space-between; margin-bottom: var(--sap-spacing-md); }
      .stat-card-title.sap-theme { font-size: 0.875rem; color: var(--sap-text-secondary); margin: 0; font-weight: 500; }
      .stat-card-icon.sap-theme { width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; }
      .stat-card-value.sap-theme { font-size: 2rem; color: var(--sap-text-primary); margin: 0; font-weight: 700; line-height: 1.2; }

      /* Page headers (Movements/Inventory/Vehicles hero sections) */
      .products-header { min-height: 76px; padding: 12px 16px; display: flex; align-items: center; justify-content: space-between; }
      .products-header .header-title { display: flex; flex-direction: column; gap: 4px; }
      .products-header .sap-title { font-size: 22px; line-height: 1.25; margin: 0; }
      .products-header .sap-subtitle { font-size: 14px; color: #64748b; margin: 0; }
      .movements-header.sap-theme { background: var(--sap-neutral-100); border: 1px solid var(--sap-neutral-300); border-radius: 12px; padding: var(--sap-spacing-lg); margin-bottom: 32px; }

      /* Tablas críticas - headers fijos para evitar reflow */
      .dashboard-table-header, .movements-table thead { min-height: 44px; }
      .dashboard-table thead th, .movements-table th { padding: 10px 12px; white-space: nowrap; }
      .table-section .table-wrapper { overflow-x: auto; }
      
      /* CLS crítico - Login y Auth layout estable */
      .auth-visual-enhanced { min-height: 100vh; position: relative; }
      .auth-container { min-height: 100vh; display: flex; align-items: center; justify-content: center; }
      .auth-content { width: 100%; max-width: 400px; padding: 2rem; }
      .login-card { min-height: 480px; background: rgba(255, 255, 255, 0.95); border-radius: 16px; padding: 2rem; }
      .hero-section { min-height: 300px; display: flex; flex-direction: column; align-items: center; justify-content: center; }
      .animated-logo { width: 80px; height: 80px; position: relative; }
      .form-group { margin-bottom: 1.5rem; min-height: 76px; }
      .form-input { width: 100%; height: 44px; padding: 0 12px; border: 1px solid #ddd; border-radius: 8px; }
      .auth-button { width: 100%; height: 48px; min-height: 48px; }
      .loading-container { position: fixed; top: 0; left: 0; right: 0; bottom: 0; display: flex; align-items: center; justify-content: center; background: rgba(255, 255, 255, 0.9); z-index: 9999; }
      .loader { text-align: center; }
      .spinner { width: 40px; height: 40px; margin: 0 auto 16px; }
      
      /* Modal layouts estables */
      .modal-backdrop { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0, 0, 0, 0.5); z-index: 1000; display: flex; align-items: center; justify-content: center; }
      .modal-content { width: 90%; max-width: 600px; max-height: 90vh; background: white; border-radius: 12px; overflow: hidden; }
      .modal-header { min-height: 60px; padding: 16px 24px; border-bottom: 1px solid #e5e7eb; }
      .modal-body { padding: 24px; }
      .modal-footer { min-height: 72px; padding: 16px 24px; border-top: 1px solid #e5e7eb; display: flex; justify-content: flex-end; gap: 12px; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
