<svg width="32" height="32" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="foodGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff6b35;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f7931e;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Fondo circular -->
  <circle cx="16" cy="16" r="15" fill="url(#foodGradient)" stroke="#e55100" stroke-width="2"/>
  
  <!-- Icono de plato y cubiertos -->
  <g transform="translate(16,16)">
    <!-- Plato -->
    <circle cx="0" cy="2" r="8" fill="white" stroke="#ff6b35" stroke-width="1"/>
    <circle cx="0" cy="2" r="6" fill="#fff3e0" stroke="#ff8a65" stroke-width="0.5"/>
    
    <!-- Tenedor (izquierda) -->
    <g transform="translate(-6,-8)">
      <rect x="-0.5" y="0" width="1" height="12" fill="white"/>
      <rect x="-1.5" y="0" width="0.8" height="3" fill="white"/>
      <rect x="0.7" y="0" width="0.8" height="3" fill="white"/>
    </g>
    
    <!-- Cuchillo (derecha) -->
    <g transform="translate(6,-8)">
      <rect x="-0.5" y="0" width="1" height="12" fill="white"/>
      <path d="M-0.5,0 L0.5,0 L1.5,1 L1.5,3 L-0.5,3 Z" fill="white"/>
    </g>
    
    <!-- Letra F estilizada -->
    <text x="0" y="6" text-anchor="middle" font-family="Arial, sans-serif" font-size="6" font-weight="bold" fill="#ff6b35">F</text>
  </g>
</svg>
