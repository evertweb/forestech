<svg width="32" height="32" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="forestGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2d5a27;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4a8b3a;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Fondo circular -->
  <circle cx="16" cy="16" r="15" fill="url(#forestGradient)" stroke="#1a4015" stroke-width="2"/>
  
  <!-- Árbol/Logo -->
  <g transform="translate(16,16)">
    <!-- Tronco -->
    <rect x="-1" y="6" width="2" height="6" fill="#8b4513"/>
    
    <!-- Hojas/Copa -->
    <path d="M-8,-8 Q-8,-12 -4,-12 Q0,-14 4,-12 Q8,-12 8,-8 Q8,-4 4,-4 Q0,-2 -4,-4 Q-8,-4 -8,-8 Z" fill="#90EE90"/>
    
    <!-- Detalles del árbol -->
    <circle cx="-3" cy="-6" r="1.5" fill="#228B22"/>
    <circle cx="3" cy="-8" r="1" fill="#32CD32"/>
    <circle cx="0" cy="-10" r="1.2" fill="#228B22"/>
    
    <!-- Letra F estilizada -->
    <text x="0" y="2" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" font-weight="bold" fill="white">F</text>
  </g>
</svg>