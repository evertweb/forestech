<svg width="1920" height="1080" viewBox="0 0 1920 1080" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="forest-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4b7988" />
      <stop offset="30%" stop-color="#336359" />
      <stop offset="70%" stop-color="#215432" />
      <stop offset="100%" stop-color="#1f322f" />
    </linearGradient>
    <radialGradient id="forest-light" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#5a8a6b" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#2d5016" stop-opacity="0.1"/>
    </radialGradient>
  </defs>
  
  <!-- Fondo base con gradiente -->
  <rect width="100%" height="100%" fill="url(#forest-bg)"/>
  
  <!-- Luz ambiental -->
  <rect width="100%" height="100%" fill="url(#forest-light)"/>
  
  <!-- Elementos de bosque estilizados -->
  <g opacity="0.6">
