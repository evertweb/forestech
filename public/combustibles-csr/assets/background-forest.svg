    <path d="M200 1080 L200 650 L180 650 Q160 630 160 600 Q160 570 180 550 L220 550 Q240 570 240 600 Q240 630 220 650 L200 650 Z" fill="#2d5016"/>
    <path d="M400 1080 L400 700 L380 700 Q360 680 360 650 Q360 620 380 600 L420 600 Q440 620 440 650 Q440 680 420 700 L400 700 Z" fill="#3a6b1f"/>
    <path d="M600 1080 L600 750 L580 750 Q560 730 560 700 Q560 670 580 650 L620 650 Q640 670 640 700 Q640 730 620 750 L600 750 Z" fill="#2d5016"/>
    <path d="M800 1080 L800 680 L780 680 Q760 660 760 630 Q760 600 780 580 L820 580 Q840 600 840 630 Q840 660 820 680 L800 680 Z" fill="#3a6b1f"/>
    
    <!-- Árboles del medio -->
    <path d="M1000 1080 L1000 600 L980 600 Q950 580 950 540 Q950 500 980 480 L1020 480 Q1050 500 1050 540 Q1050 580 1020 600 L1000 600 Z" fill="#4a7c29"/>
    <path d="M1200 1080 L1200 650 L1180 650 Q1150 630 1150 590 Q1150 550 1180 530 L1220 530 Q1250 550 1250 590 Q1250 630 1220 650 L1200 650 Z" fill="#2d5016"/>
    <path d="M1400 1080 L1400 720 L1380 720 Q1350 700 1350 660 Q1350 620 1380 600 L1420 600 Q1450 620 1450 660 Q1450 700 1420 720 L1400 720 Z" fill="#3a6b1f"/>
    
    <!-- Árboles de primer plano -->
    <path d="M1600 1080 L1600 550 L1580 550 Q1540 530 1540 480 Q1540 430 1580 410 L1620 410 Q1660 430 1660 480 Q1660 530 1620 550 L1600 550 Z" fill="#4a7c29"/>
    <path d="M1800 1080 L1800 600 L1780 600 Q1740 580 1740 530 Q1740 480 1780 460 L1820 460 Q1860 480 1860 530 Q1860 580 1820 600 L1800 600 Z" fill="#5a8a3b"/>
  </g>
  
  <!-- Elementos adicionales para profundidad -->
  <g opacity="0.3">
    <ellipse cx="300" cy="950" rx="80" ry="40" fill="#1a3d0f"/>
    <ellipse cx="700" cy="980" rx="100" ry="50" fill="#1a3d0f"/>
    <ellipse cx="1100" cy="970" rx="90" ry="45" fill="#1a3d0f"/>
    <ellipse cx="1500" cy="960" rx="110" ry="55" fill="#1a3d0f"/>
  </g>
  
  <!-- Overlay sutil para mejorar legibilidad del texto -->
  <rect width="100%" height="100%" fill="rgba(0,0,0,0.15)"/>
