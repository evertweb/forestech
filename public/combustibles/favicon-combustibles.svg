<svg width="32" height="32" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="fuelGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1976d2;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#42a5f5;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Fondo circular -->
  <circle cx="16" cy="16" r="15" fill="url(#fuelGradient)" stroke="#0d47a1" stroke-width="2"/>
  
  <!-- Icono de vehículo y combustible -->
  <g transform="translate(16,16)">
    <!-- Vehículo simplificado -->
    <rect x="-8" y="-2" width="16" height="6" rx="2" fill="white"/>
    <rect x="-6" y="-1" width="4" height="2" fill="#1976d2"/>
    <rect x="2" y="-1" width="4" height="2" fill="#1976d2"/>
    
    <!-- Ruedas -->
    <circle cx="-5" cy="4" r="2" fill="#424242"/>
    <circle cx="5" cy="4" r="2" fill="#424242"/>
    <circle cx="-5" cy="4" r="1" fill="white"/>
    <circle cx="5" cy="4" r="1" fill="white"/>
    
    <!-- Bomba de combustible -->
    <rect x="8" y="-6" width="2" height="8" fill="white"/>
    <rect x="7" y="-8" width="4" height="2" fill="white"/>
    <path d="M9,0 L12,2 L9,4" stroke="white" stroke-width="1" fill="none"/>
    
    <!-- Letra F estilizada -->
    <text x="0" y="9" text-anchor="middle" font-family="Arial, sans-serif" font-size="6" font-weight="bold" fill="white">F</text>
  </g>
</svg>
